.fr label{text-align:right;min-width:0;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.meter>i{transition:width .3s ease}}

<script id="app-js">
(function(){

var API_BASE = '/api/db';

var defaultState = JSON.parse(document.getElementById('default-state').textContent);
var DEFAULT_PIN_H = defaultState.adminPinH;

function clone(x){return JSON.parse(JSON.stringify(x))}
function normState(s){
  s = clone(s || {});
  if(!Array.isArray(s.teachers)) s.teachers = [];
  if(!Array.isArray(s.activities)) s.activities = [];
  if(!Array.isArray(s.classes)) s.classes = [];

  if(!s.adminPinH) s.adminPinH = DEFAULT_PIN_H;

}
var S = normState(defaultState);

var app = document.getElementById('app');
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function viewFromHash(){
  var h = '';
  try { h = (location.hash || '').replace('#',''); } catch(e){}
  return h === 'teacher' ? 'staff' : 'parent';
}

  adminPassVal:'', tab:'class', classId:'',
  info:'', msg:'', dirty:false, saving:false, confirm:'', draftText:'', draftOk:'',
  newPin:'', newClassName:'', newTeacherIts:'', newTeacherName:'',
  /* shared */
  itsVal:'', err:''
};

var draft = clone(S), remote = {}, names = {}, newNames = {}, progress = {};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- ITS cryptography (private lookups) ---------- */
var KC=null,H0=null;
function initC(){
  if(KC)return;
  var P=[],n,d,ok;
  for(n=2;P.length<64;n++){ok=true;for(d=2;d*d<=n;d++){if(n%d===0){ok=false;break}}if(ok)P.push(n)}
  function fr(x){return Math.floor((x-Math.floor(x))*4294967296)|0}
  KC=P.map(function(p){return fr(Math.cbrt(p))});
  H0=P.slice(0,8).map(function(p){return fr(Math.sqrt(p))});
}
function rr(x,k){return (x>>>k)|(x<<(32-k))}
function sha(m){
  initC();
  var L=m.length,T=((L+9+63)>>6)<<6,buf=new Uint8Array(T);
  buf.set(m);buf[L]=128;
  var dv=new DataView(buf.buffer);
  dv.setUint32(T-8,Math.floor(L*8/4294967296));dv.setUint32(T-4,(L*8)>>>0);
  var H=H0.slice(),w=new Array(64),o,i;
  for(o=0;o<T;o+=64){
    for(i=0;i<16;i++)w[i]=dv.getUint32(o+i*4)|0;
    for(i=16;i<64;i++){
      var a1=w[i-15],a2=w[i-2];
      w[i]=(w[i-16]+(rr(a1,7)^rr(a1,18)^(a1>>>3))+w[i-7]+(rr(a2,17)^rr(a2,19)^(a2>>>10)))|0;
    }
    var a=H[0],b=H[1],c=H[2],dd=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      var t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+KC[i]+w[i])|0;
      var t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;
      h=g;g=f;f=e;e=(dd+t1)|0;dd=c;c=b;b=a;a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+dd)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  var out=new Uint8Array(32),ov=new DataView(out.buffer);
  for(i=0;i<8;i++)ov.setUint32(i*4,H[i]>>>0);
  return out;
}
function enc(s){return new TextEncoder().encode(s)}
function hex(u){var s='';for(var i=0;i<u.length;i++)s+=(u[i]+256).toString(16).slice(1);return s}
function cat(a,b){var o=new Uint8Array(a.length+b.length);o.set(a);o.set(b,a.length);return o}
function b64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function unb64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
function derive(its){var x=sha(enc('tabbudaat-amaal|v2|'+its));for(var i=0;i<10000;i++)x=sha(x);return x}
function idOf(d){return hex(sha(cat(d,enc('id')))).slice(0,20)}
function mask(d,len){
  var k=sha(cat(d,enc('key'))),out=new Uint8Array(len),b,blk;
  for(b=0;b*32<len;b++){
    blk=sha(cat(k,new Uint8Array([b>>>24,b>>>16,b>>>8,b])));
    out.set(blk.subarray(0,Math.min(32,len-b*32)),b*32);
  }
  return out;
}
function xor(u,m){for(var i=0;i<u.length;i++)u[i]=u[i]^m[i];return u}
function seal(d,name){var u=enc(name);return b64(xor(u,mask(d,u.length)))}
function unseal(d,e){try{var u=unb64(e);return new TextDecoder().decode(xor(u,mask(d,u.length)))}catch(x){return ''}}
function pinHash(p){var x=sha(enc('tabbudaat-amaal|admin|v1|'+p));for(var i=0;i<2000;i++)x=sha(x);return hex(x)}

function cleanIts(v){
  return String(v||'').replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632)}).replace(/[۰-۹]/g,function(c){return String(c.charCodeAt(0)-1776)}).replace(/\D/g,'');
}
function findStudent(key,st){
  st=st||S;
  for(var i=0;i<st.classes.length;i++){
    var c=st.classes[i];
    for(var j=0;j<c.students.length;j++){if(c.students[j].h===key)return {s:c.students[j],c:c}}

}

/* ---------- Local convenience storage ---------- */
var mem={};
function lget(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}
function lset(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
function ldel(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}

/* ---------- Vercel Serverless Database Adapter ---------- */
function makeVercelDb(){
  function apiFetch(url, opts){
    return fetch(url, opts).then(function(r){
      return r.json().catch(function(){return {}}).then(function(body){
        if(!r.ok) throw {code: r.status===403?'invalid_argument':'unavailable', message: body.error || ('HTTP '+r.status)};
        return body;
      });
    });
  }
  return {
    doc: function(path){
      return {
        set: function(data){
          return apiFetch(API_BASE, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({path: path, data: data})
          });
        },
        onSnapshot: function(next, error){
          var dead = false, timer = null;
          function poll(){
            if(dead) return;
            apiFetch(API_BASE + '?path=' + encodeURIComponent(path)).then(function(res){
              if(dead) return;
              next({
                id: path.split('/').pop(),
                exists: !!res.exists,
                data: function(){ return res.data; },
                metadata: {fromCache: false, hasPendingWrites: false}
              });
            }, function(e){ if(!dead && error) error(e); });
          }
          poll();
          timer = setInterval(poll, 8000);
          return function(){ dead = true; clearInterval(timer); };
        }
      };
    },
    collection: function(prefix){
      return {
        onSnapshot: function(next, error){
          var dead = false, timer = null;
          function poll(){
            if(dead) return;
            apiFetch(API_BASE + '?prefix=' + encodeURIComponent(prefix)).then(function(res){
              if(dead) return;
              var docs = (res.docs || []).map(function(d){
                return {
                  id: d.id,
                  exists: true,
                  data: function(){ return d.data; },
                  metadata: {fromCache: false, hasPendingWrites: false}
                };
              });
              next({docs: docs, size: docs.length, empty: !docs.length, metadata: {fromCache: false, hasPendingWrites: false}});
            }, function(e){ if(!dead && error) error(e); });
          }
          poll();
          timer = setInterval(poll, 10000);
          return function(){ dead = true; clearInterval(timer); };
        }
      };
    }
  };
}

var db=null, dbState='connecting', dbErr='', cfgLive=false, cfgTimer=null;
var unsubCfg=null, unsubRoster=null, unsubProgAll=null, unsubProgOne=null, progOneKey='';

function softRender(){
  var a=document.activeElement;
  if(a&&a!==document.body&&a.matches&&a.matches('input,textarea,select')&&app.contains(a))return;
  render();
}
function onDbErr(e){dbErr=(e&&e.code)||'error';softRender()}

function connectDb(){
  cfgTimer = setTimeout(function(){
    if(!cfgLive && dbState==='ready'){dbState='slow';softRender()}
  },10000);
  db = makeVercelDb();
  dbState = 'ready';
  ensureSubs();
  softRender();
}

function ensureSubs(){
  if(!db)return;
  if(!unsubCfg){
    unsubCfg=db.doc('system/config').onSnapshot(function(snap){
      cfgLive=true;clearTimeout(cfgTimer);dbState='ready';dbErr='';
      if(snap.exists){
        S=normState(snap.data());
        if(!ui.dirty)draft=clone(S);
      }
      softRender();
    },onDbErr);
  }
  if(ui.role){
    if(!unsubRoster){
      unsubRoster=db.doc('system/roster').onSnapshot(function(snap){
        var x=snap.exists?snap.data():null;
        names=(x&&x.names)?clone(x.names):{};
        softRender();
      },onDbErr);
    }
    if(!unsubProgAll){
      unsubProgAll=db.collection('progress').onSnapshot(function(snap){
        var m={};
        snap.docs.forEach(function(d){var x=d.data();m[d.id]=(x&&x.days)?clone(x.days):{}});
        remote=m;
        softRender();
      },onDbErr);
    }
  }
  if(ui.screen==='child'&&ui.key&&progOneKey!==ui.key){
    if(unsubProgOne){unsubProgOne();unsubProgOne=null}
    var key=ui.key;
    progOneKey=key;ui.progReady=false;ui.progSlow=false;
    unsubProgOne=db.doc('progress/'+key).onSnapshot(function(snap){
      ui.progReady=true;
      var x=snap.exists?snap.data():null;
      if(!ui.progBusy)progress=(x&&x.days)?clone(x.days):{};
      softRender();
    },onDbErr);
    setTimeout(function(){if(!ui.progReady&&progOneKey===key){ui.progSlow=true;softRender()}},10000);
  }
}
function stopStaffSubs(){
  if(unsubRoster){unsubRoster();unsubRoster=null}
  if(unsubProgAll){unsubProgAll();unsubProgAll=null}
}
function dbMsg(e){
  if(e&&e.code==='invalid_argument')return 'Permission denied by server.';
  return 'Could not save to Vercel backend. Check your connection and try again.';
}
function vBanner(){
  var m='';
  if(dbState==='slow')m='Still connecting to the Vercel database. Check that Redis is linked to your project.';
  else if(dbErr)m='Connection error ('+dbErr+'). Ensure /api/db is deployed and Redis is linked.';
  return m?'<div class="banner alert" role="status">'+esc(m)+'</div>':'';
}

/* ---------- Date & count helpers ---------- */
function parseISO(iso){var p=iso.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])}
function fmt(iso){var dt=new Date(parseISO(iso));return {d:dt.getUTCDate(),m:MON[dt.getUTCMonth()],ml:MONL[dt.getUTCMonth()],w:WD[dt.getUTCDay()],wl:WDL[dt.getUTCDay()],y:dt.getUTCFullYear()}}
function daysOf(st){
  var out=[];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(st.start)||!/^\d{4}-\d{2}-\d{2}$/.test(st.end))return out;
  for(var t=parseISO(st.start),e=parseISO(st.end);t<=e&&out.length<120;t+=864e5){
    var dt=new Date(t);
    out.push({iso:dt.toISOString().slice(0,10),d:dt.getUTCDate(),m:MON[dt.getUTCMonth()],w:WD[dt.getUTCDay()]});
  }
  return out;
}
function todayISO(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function dayDiff(a,b){return Math.round((parseISO(b)-parseISO(a))/864e5)}
function gc(prog,iso,id){var v=prog&&prog[iso];if(!v)return 0;if(Array.isArray(v))return v.indexOf(id)>-1?1:0;return Math.max(0,+v[id]||0)}
function isDone(prog,iso,a){var c=gc(prog,iso,a.id);return a.t>0?c>=a.t:c>0}
function cnt(prog,iso,acts){return acts.filter(function(a){return isDone(prog,iso,a)}).length}
function sumDay(prog,iso,acts){var t=0;acts.forEach(function(a){t+=gc(prog,iso,a.id)});return t}
function state8(c,n){return n&&c===n?'done':(c>0?'part':'')}
function rangeLine(st){var a=fmt(st.start),b=fmt(st.end);return a.d+' '+a.m+' to '+b.d+' '+b.m+' '+b.y}
function pad2(n){return String(n).padStart(2,'0')}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

function parentLink(){
  if(S.parentUrl&&/^https?:\/\//i.test(S.parentUrl))return S.parentUrl;
  try{return window.location.href.split('#')[0]}catch(e){return ''}
}
function remHref(){
  var ds=daysOf(S);
  if(!ds.length)return '#';
  var tm=(ui.remTime||'20:00').split(':'),hh=+tm[0]||0,mm=+tm[1]||0;
  var day=ds[0].iso.replace(/-/g,''),end=(hh*60+mm+15)%1440;
  var a=day+'T'+pad2(hh)+pad2(mm)+'00',b=day+'T'+pad2(Math.floor(end/60))+pad2(end%60)+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'+
    '&text='+encodeURIComponent('Mark today’s Tabbudaat Amaal')+
    '&details='+encodeURIComponent('Open '+parentLink()+' and add today’s counts.')+
    '&dates='+a+'/'+b+'&recur='+encodeURIComponent('RRULE:FREQ=DAILY;COUNT='+ds.length);
}

function vChild(){

  if(!hit){
    return '<div class="top"><div class="brand">Tabbudaat Amaal<small>Parent Portal</small></div></div>'+
      '<p class="note">This file is no longer on the class list.</p><button class="btn" data-act="switch">Back</button>';
  }
  if(!ds.length){
    return '<div class="top"><div class="brand">Tabbudaat Amaal<small>Parent Portal</small></div></div>'+
      '<p class="note">No valid recitation dates configured yet.</p>';
  }
  if(!ui.sel||!ds.some(function(d){return d.iso===ui.sel})){
    ui.sel=t>=S.start&&t<=S.end?t:(t<S.start?S.start:S.end);
  }
  var ticks=0,full=0;
  ds.forEach(function(d){var c=cnt(progress,d.iso,acts);ticks+=c;if(n&&c===n)full++});
  var pct=ds.length&&n?Math.round(ticks/(ds.length*n)*100):0;
  var status;
  if(t<S.start){var k=dayDiff(t,S.start);status='Starts in '+k+(k===1?' day':' days')+' ('+fmt(S.start).d+' '+fmt(S.start).m+')'}
  else if(t>S.end){status='The recitation period has ended'}
  else{status='Day '+(dayDiff(S.start,t)+1)+' of '+ds.length}
  var sel=ds.filter(function(d){return d.iso===ui.sel})[0];
  var c=cnt(progress,sel.iso,acts),f=fmt(sel.iso);

  var syncNote=ui.progReady?'Saved and shared with the teacher dashboard':(ui.progSlow?'Cannot reach your saved counts yet':'Loading your saved counts…');

  var banners='';
  if(ui.progReady){
    var missed=ds.filter(function(d){return d.iso<t&&cnt(progress,d.iso,acts)===0});
    var inRange=t>=S.start&&t<=S.end;
    var todayNone=inRange&&n>0&&cnt(progress,t,acts)===0;
    if(todayNone){
      banners+='<div class="banner" role="status"><strong>You haven’t marked today yet.</strong>Enter what your child has read today.<div class="row"><button class="btn sm" data-act="day" data-d="'+t+'">Mark today</button></div></div>';

    }

  var chips=ds.map(function(d,i){
    var cc=cnt(progress,d.iso,acts);
    var cls='day '+state8(cc,n)+(d.iso===t?' today':'')+(d.iso>t?' future':'')+(ui.progReady&&d.iso<t&&cc===0?' miss':'');
    var showM=i===0||d.d===1;

      '<span class="w">'+d.w+'</span><span class="n">'+d.d+'</span><span class="m">'+(showM?d.m:'')+'</span></button>';
  }).join('');

  var list=acts.map(function(a){
    var v=gc(progress,sel.iso,a.id),fin=isDone(progress,sel.iso,a),id=esc(a.id);
    return '<li><div class="fr'+(fin?' fin':'')+'">'+
      '<input class="num" type="number" inputmode="numeric" min="0" max="99999" id="n-'+id+'" name="n-'+id+'" value="'+(v>0?v:'')+'" placeholder="0">'+
      '<label for="n-'+id+'"><span class="ar" lang="ar" dir="rtl">'+esc(a.ar)+'</span>'+((a.tr||a.t)?'<span class="tr">'+esc(a.tr||'')+(a.t?(a.tr?' · ':'')+'target '+a.t:'')+'</span>':'')+'</label></div></li>';
  }).join('');

  var canSubmit=!!db&&ui.progReady&&!ui.progBusy;
  var btnLabel=ui.progBusy?'Saving…':(ui.progReady?'Submit':'Loading…');

  return '<div class="top"><div class="brand">Tabbudaat Amaal<small>'+esc(hit.c.name)+'</small></div>'+
    '<div class="row"><button class="btn ghost sm" data-act="goto" data-v="staff">Teacher Dashboard</button>'+
    '<button class="btn ghost sm" data-act="switch">Not you?</button></div></div>'+
    vBanner()+
    '<h1>'+esc(ui.name||'Your child')+'</h1>'+
    '<div class="gap8" style="margin-bottom:20px"><div class="row between"><span class="note">'+esc(status)+'</span><span class="note">'+full+' of '+ds.length+' days complete</span></div>'+
    '<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
    '<span class="note" id="sync">'+esc(syncNote)+'</span></div>'+
    banners+

    '<section class="card stack"><div class="row between"><div><h2>'+f.wl+', '+f.d+' '+f.ml+'</h2><span class="note">'+c+' of '+n+' done · '+sumDay(progress,sel.iso,acts)+' recited</span></div></div>'+
    (n&&c===n?'<p class="done-msg">Day complete. Masha’Allah.</p>':'')+

    '<div class="row"><input id="remTime" type="time" value="'+esc(ui.remTime)+'" style="max-width:150px" aria-label="Reminder time">'+
    '<a id="remLink" class="btn ghost" href="'+esc(remHref())+'" target="_blank" rel="noopener">Add to Google Calendar</a></div></section>';
}

function saveCounts(){
  if(!db||!ui.progReady||ui.progBusy)return;
  var iso=ui.sel,o={};
  S.activities.forEach(function(a){
    var el=document.getElementById('n-'+a.id);

  });
  var prev=progress,next=clone(progress);
  if(Object.keys(o).length)next[iso]=o;else delete next[iso];

  }).join('');

  return '<div class="stack">'+
    '<div class="card stack"><h3>Recitation Schedule</h3>'+
      '<div class="row"><div class="grow"><label class="f">Start Date</label><input type="date" data-cfg="start" value="'+esc(draft.start)+'"></div>'+
      '<div class="grow"><label class="f">End Date</label><input type="date" data-cfg="end" value="'+esc(draft.end)+'"></div></div>'+
      '<div><label class="f">Parent Portal URL (for Calendar Reminders)</label>'+
      '<input type="url" data-cfg="parentUrl" placeholder="https://your-app.vercel.app" value="'+esc(draft.parentUrl||'')+'"></div>'+
    '</div>'+
    '<div class="card stack"><h3>Teachers (ITS Access)</h3>'+
      '<div class="row"><input style="width:140px" inputmode="numeric" id="t-add-its" placeholder="Teacher ITS" value="'+esc(ui.newTeacherIts)+'">'+
      '<input class="grow" id="t-add-name" placeholder="Teacher Name" value="'+esc(ui.newTeacherName)+'">'+
      '<button class="btn sm" data-act="add-tch">Add</button></div>'+
      tList +
    '</div>'+
    '<div class="card stack"><h3>Change Admin Passcode</h3>'+
      '<div class="row"><input type="password" id="new-pin" placeholder="New passcode (min 4 chars)" value="'+esc(ui.newPin)+'" class="grow">'+
      '<button class="btn sm" data-act="set-pin">Update Passcode</button></div>'+
    '</div>'+
  '</div>';
}

function exportCsv(){
  var cls = curClass(S);
  if(!cls) return;
  var ds = daysOf(S), acts = S.activities;
  var header = ['Student Name'].concat(ds.map(function(d){return d.iso})).concat(['Total Recited']);
  var lines = [header.join(',')];
  cls.students.forEach(function(s){
    var p = remote[s.h] || {}, tot = 0;
    var row = ['"'+nameOf(s.h).replace(/"/g,'""')+'"'];
    ds.forEach(function(d){
      var sum = sumDay(p, d.iso, acts);
      tot += sum;
      row.push(sum);
    });
    row.push(tot);
    lines.push(row.join(','));
  });
  var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = cls.name.replace(/\s+/g,'_') + '_Tabbudaat.csv';
  a.click();
}

function publishDraft(){
  if(!db || ui.saving) return;
  ui.saving = true; ui.err = ''; ui.msg = '';
  render();
  var mergedNames = Object.assign({}, names, newNames);
  Promise.all([
    db.doc('system/config').set(draft),
    db.doc('system/roster').set({names: mergedNames})
  ]).then(function(){
    S = clone(draft);
    names = mergedNames;
    newNames = {};
    ui.dirty = false;
    ui.saving = false;
    ui.msg = 'Published! All parents and teachers now see the updated setup.';
    render();
  }, function(e){
    ui.saving = false;
    ui.err = dbMsg(e);
    render();
  });
}

/* =====================  MAIN RENDER & EVENTS  ===================== */
function render(){
  if(ui.view === 'staff'){
    app.innerHTML = ui.role ? vStaff() : vStaffLogin();
  } else {
    app.innerHTML = (ui.screen === 'child' && ui.key) ? vChild() : vParentLogin();
  }
}

app.addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target.getAttribute('data-form');

  if(f === 'login'){
    var raw = cleanIts(document.getElementById('its').value);
    ui.itsVal = raw; ui.err = '';
    if(raw.length < 6){ ui.err = 'Please enter a valid 8-digit ITS number.'; render(); return; }
    var d = derive(raw), k = idOf(d), hit = findStudent(k);
    if(!hit){ ui.err = 'ITS number not found on the class list. Check with the school teacher.'; render(); return; }
    var nm = unseal(d, hit.s.e) || 'Student';
    ui.key = k; ui.name = nm; ui.screen = 'child'; ui.saved = '';
    lset(LS_KEY, k); lset(LS_NAME, nm);
    ensureSubs();
    render();
  }

  if(f === 'counts'){
    saveCounts();
  }

  if(f === 'staff-teacher'){
    var rawT = cleanIts(document.getElementById('t-its').value);
    ui.itsVal = rawT; ui.err = '';
    var kT = idOf(derive(rawT)), tHit = findTeacher(kT);
    if(!tHit){ ui.err = 'Teacher ITS not recognized.'; render(); return; }
    ui.role = 'teacher'; ui.teacherName = tHit.name; ui.teacherClassIds = tHit.classIds || [];
    try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify({role:'teacher', name:tHit.name, classIds:ui.teacherClassIds})); }catch(x){}
    ensureSubs();
    render();
  }

  if(f === 'staff-admin'){
    var p = document.getElementById('a-pin').value;
    ui.adminPassVal = p; ui.err = '';
   var valid = (S.adminPinH && S.adminPinH !== DEFAULT_PIN_H)
      ? (pinHash(p) === S.adminPinH)
      : (p === '1234');
    if(!valid){
      ui.err = 'Incorrect admin passcode.'; render(); return;
    }
    ui.role = 'admin'; ui.adminPassVal = '';
    try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify({role:'admin'})); }catch(x){}
    ensureSubs();
    render();
  }
});

app.addEventListener('click', function(e){
  var btn = e.target.closest('[data-act]');
  if(!btn) return;
  var act = btn.getAttribute('data-act');
  ui.err = ''; ui.msg = '';

  if(act === 'goto'){
    ui.view = btn.getAttribute('data-v');
    try{ location.hash = ui.view === 'staff' ? 'teacher' : ''; }catch(x){}
    ensureSubs(); render();
  }
  else if(act === 'switch'){
    ui.screen = 'login'; ui.key = ''; ui.name = ''; ui.itsVal = ''; ui.saved = '';
    progOneKey = '';
    if(unsubProgOne){ unsubProgOne(); unsubProgOne = null; }
    ldel(LS_KEY); ldel(LS_NAME);
    render();
  }
  else if(act === 'day'){
    ui.sel = btn.getAttribute('data-d'); ui.saved = '';
    render();
  }
  else if(act === 'lmode'){
    ui.loginMode = btn.getAttribute('data-m');
    render();
  }
  else if(act === 'staff-out'){
    ui.role = null; ui.dirty = false; draft = clone(S);
    try{ sessionStorage.removeItem(SESSION_KEY); }catch(x){}
    stopStaffSubs();
    render();
  }
  else if(act === 'tab'){
    ui.tab = btn.getAttribute('data-t');
    render();
  }
  else if(act === 'cls'){
    ui.classId = btn.getAttribute('data-c');
    render();
  }
  else if(act === 'csv'){
    exportCsv();
  }
  else if(act === 'add-cls'){
    var nm = (document.getElementById('new-cls').value || '').trim();
    if(!nm) return;
    var cid = uid('c');
    draft.classes.push({id: cid, name: nm, students: []});
    ui.classId = cid; ui.newClassName = ''; ui.dirty = true;
    render();
  }
  else if(act === 'import-stu'){
    var cls = curClass(draft) || draft.classes[0];
    var raw = document.getElementById('bulk-stu').value || '';
    if(!cls || !raw.trim()) return;
    var added = 0;
    raw.split(/\r?\n/).forEach(function(line){
      var parts = line.split(/[,|\t]+/);
      if(parts.length < 2) return;
      var its = cleanIts(parts[0]), sname = parts.slice(1).join(' ').trim();
      if(its.length < 6 || !sname) return;
      var d = derive(its), h = idOf(d), encName = seal(d, sname);
      newNames[h] = sname;
      var exists = cls.students.some(function(st){ return st.h === h; });
      if(!exists){ cls.students.push({h: h, e: encName}); added++; }
    });
    ui.draftText = ''; ui.dirty = true;
    ui.msg = 'Added ' + added + ' student(s) to draft. Click Publish Changes to save.';
    render();
  }
  else if(act === 'del-stu'){
    var clsD = curClass(draft) || draft.classes[0];
    var idx = +btn.getAttribute('data-i');
    if(clsD){ clsD.students.splice(idx, 1); ui.dirty = true; render(); }
  }
  else if(act === 'add-act'){
    draft.activities.push({id: uid('a'), ar: '', tr: '', t: 0});
    ui.dirty = true; render();
  }
  else if(act === 'del-act'){
    var aIdx = +btn.getAttribute('data-i');
    draft.activities.splice(aIdx, 1);
    ui.dirty = true; render();
  }
  else if(act === 'add-tch'){
    var tIts = cleanIts(document.getElementById('t-add-its').value);
    var tNm = (document.getElementById('t-add-name').value || '').trim();
    if(tIts.length < 6 || !tNm){ ui.err = 'Enter both Teacher ITS and Name.'; render(); return; }
    draft.teachers.push({h: idOf(derive(tIts)), name: tNm, classIds: []});
    ui.newTeacherIts = ''; ui.newTeacherName = ''; ui.dirty = true;
    render();
  }
  else if(act === 'del-tch'){
    draft.teachers.splice(+btn.getAttribute('data-i'), 1);
    ui.dirty = true; render();
  }
  else if(act === 'set-pin'){
    var np = (document.getElementById('new-pin').value || '').trim();
    if(np.length < 4){ ui.err = 'Passcode must be at least 4 characters.'; render(); return; }
    draft.adminPinH = pinHash(np);
    ui.newPin = ''; ui.dirty = true;
    ui.msg = 'Passcode updated in draft. Click Publish Changes to apply.';
    render();
  }
  else if(act === 'discard'){
    draft = clone(S); newNames = {}; ui.dirty = false;
    render();
  }
  else if(act === 'publish'){
    publishDraft();
  }
});

app.addEventListener('input', function(e){
  var el = e.target;
  if(el.id === 'remTime'){
    ui.remTime = el.value;
    var lk = document.getElementById('remLink');
    if(lk) lk.href = remHref();
  }
  else if(el.hasAttribute('data-act-field')){
    var idx = +el.getAttribute('data-i'), fld = el.getAttribute('data-act-field');
    if(draft.activities[idx]){
      draft.activities[idx][fld] = fld === 't' ? Math.max(0, Math.floor(+el.value || 0)) : el.value;
      ui.dirty = true;
    }
  }
  else if(el.hasAttribute('data-cfg')){
    draft[el.getAttribute('data-cfg')] = el.value;
    ui.dirty = true;
  }
});

/* Boot: restore saved parent/staff sessions */
(function boot(){
  var savedKey = lget(LS_KEY), savedName = lget(LS_NAME);
  if(savedKey){ ui.key = savedKey; ui.name = savedName || 'Student'; ui.screen = 'child'; }
  try{
    var ss = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
    if(ss && ss.role){ ui.role = ss.role; ui.teacherName = ss.name || ''; ui.teacherClassIds = ss.classIds || []; }
  }catch(x){}
  connectDb();
  render();
})();

})();
</script>
